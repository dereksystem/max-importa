[pytest]
# Suíte de regressão do Max_Importa. Rodar da pasta da instalação:
#   python -m pytest                 -> tudo (unitários + integração de banco)
#   python -m pytest -m "not db"     -> só unitários (rápido, sem SQL Server)
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    db: integração — exige o SQL Server de teste (cria/dropa BD_ZERO_TEST). O BUILD.bat só roda estes quando MI_TEST_DB=1.
